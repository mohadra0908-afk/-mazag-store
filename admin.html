<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة مزاج</title>
<style>
:root{--g:#0b3d2e;--gold:#c9a227}*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Tahoma,sans-serif;background:#f6f4ec}
header{background:var(--g);color:var(--gold);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold)}
button,select{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 13px;background:var(--gold);color:var(--g);font-weight:700}
input,textarea{font:inherit;width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;margin:4px 0}
.b{background:#fff;border-radius:14px;padding:14px;margin:12px;box-shadow:0 1px 6px #0002}
.t{display:flex;gap:8px;padding:12px 12px 0}.t button{flex:1;background:#ddd;color:#333}.t .a{background:var(--g);color:var(--gold)}
.r{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}.r img{width:54px;height:54px;border-radius:8px;object-fit:cover}
.r>div{flex:1;font-size:14px}.d{background:#b3261e;color:#fff}.x{display:none}
</style></head><body>
<header><b>لوحة إدارة مزاج MAZAG</b><button id="out" class="x" onclick="logout()">خروج</button></header>
<div id="L" class="b"><h3>تسجيل دخول المدير</h3><input id="em" type="email" placeholder="البريد الإلكتروني"><input id="pw" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><p id="le" style="color:#b3261e"></p></div>
<div id="A" class="x"><div class="t"><button id="t1" class="a" onclick="tab(1)">المنتجات</button><button id="t2" onclick="tab(2)">الطلبات</button><button id="t3" onclick="tab(3)">التعليقات</button></div>
<div id="V1"><div class="b"><h3 id="ft">إضافة منتج</h3><input id="pn" placeholder="اسم المنتج"><input id="pp" type="number" step="0.01" placeholder="السعر (جنيه) لو ما في أوزان"><input id="pwt" placeholder="الوزن (مثال: 500 جرام)"><select id="pc" style="width:100%;padding:10px;margin:4px 0;font-weight:400;background:#fff"></select><input id="ps" type="number" placeholder="الكمية في المخزون"><input id="pk" inputmode="decimal" placeholder="سعر الكيلو (جنيه) — يحسب الأوزان تلقائياً"><input id="pg" value="250,500,1000" placeholder="الأوزان بالجرام مفصولة بفاصلة"><p style="margin:2px 0;font-size:12px;color:#666">أو اكتب الأوزان والأسعار يدوياً هنا:</p><textarea id="po" rows="3" placeholder="الأوزان والأسعار، سطر لكل وزن، مثال:
250 جرام=100
500 جرام=190"></textarea><input id="pcm" inputmode="decimal" placeholder="أقل مبلغ يكتبه الزبون (يفعّل خيار بمبلغ تختاره)"><textarea id="pd" rows="2" placeholder="وصف (اختياري)"></textarea><input id="pf" type="file" accept="image/*"><label><input id="pv" type="checkbox" checked style="width:auto"> ظاهر في المتجر</label><br><button onclick="saveP()">حفظ</button> <button style="background:#ddd" onclick="reset()">جديد</button><p id="fm"></p></div><div id="PL" class="b"></div></div>
<div id="V2" class="x"><div id="OL" class="b"></div></div><div id="V3" class="x"><div id="RL" class="b"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient("https://anrgqsjqvnbnpwxlsxqz.supabase.co","sb_publishable_x2u4Sxpz5zZD3pM-N_Y2HA_Qrn4BWpt");
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS=["البقالة","مشروبات","ألبان ومشتقاتها","بهارات وتوابل","منتجات بلدية","كوزماتك"];let P=[],edit=null,img=null;const $=id=>document.getElementById(id);
async function login(){le.textContent="";const{error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(error){le.textContent="بيانات الدخول غير صحيحة";return}init()}
async function logout(){await sb.auth.signOut();location.reload()}
async function init(){const{data:{user}}=await sb.auth.getUser();if(!user)return;
const{data}=await sb.from("admins").select("user_id").eq("user_id",user.id);
if(!data||!data.length){le.textContent="هذا الحساب ليس مديراً";await sb.auth.signOut();return}
L.classList.add("x");A.classList.remove("x");out.classList.remove("x");loadP();loadO();loadR()}
function tab(n){V1.classList.toggle("x",n!=1);V2.classList.toggle("x",n!=2);V3.classList.toggle("x",n!=3);t1.className=n==1?"a":"";t2.className=n==2?"a":"";t3.className=n==3?"a":""}
async function loadP(){const{data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});if(error){PL.textContent="خطأ: "+error.message;return}P=data;
PL.innerHTML=P.map(p=>`<div class="r">${p.image_url?`<img src="${E(p.image_url)}">`:""}<div><b>${E(p.name)}</b><br>${p.price??"-"} جنيه | ${E(p.weight||"")} | مخزون: ${p.stock??0}${(p.options&&p.options.length)?" | أوزان: "+p.options.length:""}${+p.custom_min>0?" | بمبلغ من "+p.custom_min:""}<br>${E(p.category||"بدون قسم")} | ${p.is_visible?"ظاهر":"مخفي"}</div><button onclick="vis('${p.id}',${!p.is_visible})">${p.is_visible?"إخفاء":"إظهار"}</button><button onclick="ed('${p.id}')">تعديل</button><button class="d" onclick="del('${p.id}')">حذف</button></div>`).join("")||"لا توجد منتجات"}
async function vis(id,v){await sb.from("products").update({is_visible:v}).eq("id",id);loadP()}
async function del(id){if(!confirm("حذف المنتج؟"))return;await sb.from("products").delete().eq("id",id);loadP()}
function ed(id){const p=P.find(x=>x.id==id);edit=id;img=p.image_url;pn.value=p.name||"";pp.value=p.price??"";pwt.value=p.weight||"";po.value=(p.options||[]).map(o=>o.w+"="+o.p).join("\n");pcm.value=p.custom_min??"";pk.value="";pg.value="250,500,1000";pc.value=p.category||"";ps.value=p.stock??0;pd.value=p.description||"";pv.checked=!!p.is_visible;ft.textContent="تعديل منتج";scrollTo(0,0)}
function reset(){edit=null;img=null;[pn,pp,pwt,ps,pd,pf,pc,po,pcm,pk].forEach(e=>e.value="");pg.value="250,500,1000";pv.checked=true;ft.textContent="إضافة منتج";fm.textContent=""}
const nd=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
function parseOpts(){const out=[];for(const ln of po.value.split("\n")){const t=ln.trim();if(!t)continue;const i=t.lastIndexOf("=");if(i<1)return{err:"سطر غير صحيح: "+t};const w=t.slice(0,i).trim(),p=parseFloat(nd(t.slice(i+1)));if(!w||!(p>0))return{err:"سطر غير صحيح: "+t};out.push({w,p})}return{out}}
async function saveP(){if(!pn.value.trim())return alert("اكتب اسم المنتج");
let o;const kg=parseFloat(nd(pk.value));
if(kg>0){const gs=nd(pg.value).split(/[,،\s]+/).map(Number).filter(x=>x>0);if(!gs.length)return alert("اكتب الأوزان بالجرام مثل: 250,500,1000");o={out:gs.map(g=>({w:g>=1000?(g/1000==1?"1 كيلو":(g/1000)+" كيلو"):g+" جرام",p:Math.round(kg*g/1000)}))}}
else{o=parseOpts();if(o.err)return alert(o.err+"\nاكتب هكذا: 250 جرام=100")}
const mn=parseFloat(nd(pcm.value))||null;
fm.textContent="جاري الحفظ...";let url=img;
const f=pf.files[0];if(f){const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+(f.name.split(".").pop()||"jpg");
const{error}=await sb.storage.from("product-images").upload(path,f);if(error){fm.textContent="فشل رفع الصورة: "+error.message;return}
url=sb.storage.from("product-images").getPublicUrl(path).data.publicUrl}
const row={name:pn.value.trim(),price:+pp.value||0,weight:pwt.value.trim(),category:pc.value||null,options:o.out,custom_min:mn,stock:parseInt(ps.value)||0,description:pd.value.trim(),image_url:url,is_visible:pv.checked};
const r=edit?await sb.from("products").update(row).eq("id",edit):await sb.from("products").insert(row);
if(r.error){fm.textContent="خطأ: "+r.error.message;return}reset();fm.textContent="تم الحفظ";loadP()}
const ST=["جديد","قيد التجهيز","تم الشحن","تم التسليم","ملغي"];
async function loadO(){const{data,error}=await sb.from("orders").select("*").order("created_at",{ascending:false});if(error){OL.textContent="خطأ: "+error.message;return}
OL.innerHTML=data.map(o=>`<div class="r" style="align-items:flex-start"><div><b>${E(o.customer_name)}</b> — ${E(o.phone)}<br>${E(o.address)}<br>${(o.items||[]).map(i=>E(i.name)+" ×"+i.qty).join("، ")}<br><b>${o.total} جنيه</b> | ${new Date(o.created_at).toLocaleString("ar-EG")}</div><select onchange="st('${o.id}',this.value)">${ST.map(s=>`<option ${s==o.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")||"لا توجد طلبات"}
async function st(id,v){await sb.from("orders").update({status:v}).eq("id",id)}
pc.innerHTML='<option value="">بدون قسم</option>'+CATS.map(c=>`<option>${c}</option>`).join("");
async function loadR(){const{data,error}=await sb.from("reviews").select("*").order("created_at",{ascending:false});if(error){RL.textContent="خطأ: "+error.message;return}
RL.innerHTML=data.map(r=>`<div class="r" style="align-items:flex-start"><div><b>${E(r.name)}</b> — ${r.approved?"ظاهر":"بانتظار المراجعة"}<br>${E(r.comment)}</div><button onclick="apR('${r.id}',${!r.approved})">${r.approved?"إخفاء":"قبول"}</button><button class="d" onclick="delR('${r.id}')">حذف</button></div>`).join("")||"لا توجد تعليقات"}
async function apR(id,v){await sb.from("reviews").update({approved:v}).eq("id",id);loadR()}
async function delR(id){if(!confirm("حذف التعليق؟"))return;await sb.from("reviews").delete().eq("id",id);loadR()}
init();
</script></body></html>
