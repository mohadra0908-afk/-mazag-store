<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مزاج MAZAG</title>
<style>
:root{--g:#0b3d2e;--gold:#c9a227}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Tahoma,sans-serif;background:#f6f4ec;color:#222}
header{background:var(--g);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--gold)}
h1{margin:0;font-size:22px;color:var(--gold)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--gold);color:var(--g);font-weight:700}
input,textarea{font:inherit;width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin:5px 0}
.s{padding:12px 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 30px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.c{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px #0002;display:flex;flex-direction:column}
.c img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:#e7e2d0;display:flex;align-items:center;justify-content:center;color:var(--g);font-size:30px}
.c div.i{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}.c b{font-size:15px}.c small{color:#666}.p{color:var(--g);font-weight:700}
.c button.add{margin-top:auto}.c button:disabled{background:#ccc;color:#777}
.obs{display:flex;flex-wrap:wrap;gap:4px}.ob{padding:5px 9px;font-size:13px;background:#fff;color:var(--g);border:1px solid var(--gold)}.ob.a{background:var(--g);color:var(--gold)}
.c input{padding:7px;font-size:14px;margin:2px 0}
#cart{position:fixed;inset:0;background:#0007;display:none;z-index:10}#cart.o{display:block}
#box{position:absolute;bottom:0;left:0;right:0;max-height:90%;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px}
.r{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0;gap:8px}
.q button{padding:4px 11px}.q span{margin:0 8px}
.w{background:#25d366;color:#fff;width:100%;margin-top:10px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px}.cats button{white-space:nowrap;background:#fff;color:var(--g);border:1px solid var(--gold)}.cats button.a{background:var(--g);color:var(--gold)}
.ov{position:fixed;inset:0;background:#0007;display:none;z-index:10}.ov.o{display:block}
#rbox{position:absolute;bottom:0;left:0;right:0;max-height:90%;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px}
.rv{border-bottom:1px solid #eee;padding:10px 0}.rv b{color:var(--g)}.rv small{color:#888}
</style></head><body>
<header><h1>مزاج MAZAG</h1><div style="display:flex;gap:8px"><button onclick="openRv()">💬 آراء</button><button onclick="openCart()">🛒 السلة (<span id="n">0</span>)</button></div></header>
<div class="s"><input id="q" placeholder="ابحث عن منتج..." oninput="draw()"></div>
<div id="cats" class="cats"></div>
<div id="g" class="grid"></div><p id="m" style="text-align:center;color:#666"></p>
<div id="cart" onclick="if(event.target.id=='cart')closeCart()"><div id="box">
<h2 style="color:var(--g);margin-top:0">سلة المشتريات</h2><div id="items"></div>
<h3>الإجمالي: <span id="t">0</span> جنيه</h3>
<input id="nm" placeholder="الاسم"><input id="ph" type="tel" placeholder="رقم الهاتف"><textarea id="ad" rows="2" placeholder="العنوان"></textarea>
<button class="w" onclick="send()">إرسال الطلب عبر واتساب</button>
<button style="width:100%;margin-top:8px;background:#eee" onclick="closeCart()">إغلاق</button></div></div>
<div id="rv" class="ov" onclick="if(event.target.id=='rv')closeRv()"><div id="rbox">
<h2 style="color:var(--g);margin-top:0">آراء زبائننا</h2><div id="rl"></div>
<h3>اكتب رأيك</h3><input id="rn" maxlength="40" placeholder="اسمك"><textarea id="rc" rows="3" maxlength="300" placeholder="تعليقك"></textarea>
<button id="rs" style="width:100%" onclick="sendRv()">إرسال التعليق</button><p id="rm" style="color:var(--g)"></p>
<button style="width:100%;margin-top:4px;background:#eee" onclick="closeRv()">إغلاق</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient("https://anrgqsjqvnbnpwxlsxqz.supabase.co","sb_publishable_x2u4Sxpz5zZD3pM-N_Y2HA_Qrn4BWpt");
const WA="201003258915";const CATS=["البقالة","مشروبات","ألبان ومشتقاتها","بهارات وتوابل","منتجات بلدية","كوزماتك"];
let P=[],C={},cat="الكل",sel={};
try{C=JSON.parse(localStorage.getItem("c2")||"{}")}catch(e){}
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nd=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const save=()=>{try{localStorage.setItem("c2",JSON.stringify(C))}catch(e){}};
const opts=p=>p.options&&p.options.length?p.options:(+p.price>0?[{w:p.weight||"",p:+p.price}]:[]);
const cus=p=>+p.custom_min>0,cmin=p=>+p.custom_min;
const cur=p=>sel[p.id]!==undefined?sel[p.id]:(opts(p).length?0:(cus(p)?-1:null));
async function load(){const{data,error}=await sb.from("products").select("*").eq("is_visible",true).order("created_at",{ascending:false});
if(error){m.textContent="تعذر تحميل المنتجات";return}P=data;draw();count()}
function setCat(c){cat=c;draw()}
function pick(id,i){sel[id]=i;draw()}
function draw(){const k=q.value.trim();cats.innerHTML=["الكل",...CATS].map(c=>`<button class="${c==cat?"a":""}" onclick="setCat('${c}')">${c}</button>`).join("");
const L=P.filter(p=>(cat=="الكل"||p.category==cat)&&(!k||(p.name||"").includes(k)));
g.innerHTML=L.map(p=>{const o=opts(p),s=cur(p),ok=p.stock>0&&s!==null;
const price=s===null?"السعر غير محدد":(s>=0?o[s].p+" جنيه":"بمبلغ تختاره");
const multi=o.length>1||(cus(p)&&o.length);
const btns=multi||cus(p)?`<div class="obs">${o.map((x,i)=>`<button class="ob ${s===i?"a":""}" onclick="pick('${p.id}',${i})">${E(x.w||"الوحدة")}</button>`).join("")}${cus(p)?`<button class="ob ${s===-1?"a":""}" onclick="pick('${p.id}',-1)">بمبلغ تختاره</button>`:""}</div>`:(o.length&&o[0].w?`<small>${E(o[0].w)}</small>`:"");
const ci=s===-1?`<input id="ci-${p.id}" inputmode="decimal" placeholder="اكتب المبلغ (من ${cmin(p)} جنيه فأكثر)">`:"";
return `<div class="c">${p.image_url?`<img src="${E(p.image_url)}" alt="">`:'<div class="ph">🌿</div>'}<div class="i"><b>${E(p.name)}</b>${btns}${ci}<span class="p">${price}</span>${p.description?`<small>${E(p.description)}</small>`:""}<button class="add" ${ok?"":"disabled"} onclick="add('${p.id}')">${p.stock<=0?"غير متوفر":(s===null?"غير متاح":"أضف للسلة")}</button></div></div>`}).join("");
m.textContent=L.length?"":"لا توجد منتجات"}
function add(id){const p=P.find(x=>x.id==id),s=cur(p);if(s===null)return;let key,l;
if(s>=0){key=id+"|o"+s;l={id,t:"o",i:s}}
else{const v=parseFloat(nd(document.getElementById("ci-"+id).value)),mn=cmin(p);
if(!(v>=mn))return alert("أقل مبلغ هو "+mn+" جنيه");key=id+"|c"+v;l={id,t:"c",a:v}}
const e=C[key]||{...l,qty:0};e.qty=Math.min(e.qty+1,p.stock);C[key]=e;save();count()}
function info(l){const p=P.find(x=>x.id==l.id);if(!p)return null;
if(l.t=="o"){const o=opts(p)[l.i];if(!o)return null;return{name:p.name,weight:o.w,price:o.p,qty:l.qty}}
if(!cus(p)||l.a<cmin(p))return null;return{name:p.name,weight:"بمبلغ",price:l.a,qty:l.qty}}
function lines(){return Object.keys(C).map(k=>{const x=info(C[k]);return x?{...x,key:k}:null}).filter(Boolean)}
function chg(key,d){const e=C[key];if(!e)return;const p=P.find(x=>x.id==e.id);e.qty=Math.min(e.qty+d,p?p.stock:99);if(e.qty<=0)delete C[key];save();count();cartDraw()}
function count(){n.textContent=lines().reduce((a,l)=>a+l.qty,0)}
function cartDraw(){const L=lines();items.innerHTML=L.length?L.map(l=>`<div class="r"><div><b>${E(l.name)}</b><br><small>${E(l.weight||"")} — ${l.price} جنيه</small></div><div class="q"><button onclick="chg('${l.key}',1)">+</button><span>${l.qty}</span><button onclick="chg('${l.key}',-1)">−</button></div></div>`).join(""):"<p>السلة فارغة</p>";
t.textContent=L.reduce((a,l)=>a+l.price*l.qty,0)}
function openCart(){cartDraw();cart.classList.add("o")}function closeCart(){cart.classList.remove("o")}
async function send(){const L=lines();if(!L.length)return alert("السلة فارغة");
const a=nm.value.trim(),b=ph.value.trim(),c=ad.value.trim();if(!a||!b||!c)return alert("اكتب الاسم والهاتف والعنوان");
const total=L.reduce((s,l)=>s+l.price*l.qty,0);
const{error}=await sb.from("orders").insert({customer_name:a,phone:b,address:c,items:L.map(({name,weight,price,qty})=>({name,weight,price,qty})),total,status:"جديد"});
if(error)alert("تعذر حفظ الطلب في النظام، سنكمل الإرسال عبر واتساب");
const msg=`طلب جديد من مزاج MAZAG\nالاسم: ${a}\nالهاتف: ${b}\nالعنوان: ${c}\n\n`+L.map(l=>`- ${l.name} ${l.weight||""} × ${l.qty} = ${l.price*l.qty} جنيه`).join("\n")+`\n\nالإجمالي: ${total} جنيه`;
if(!error){C={};save();count()}
location.href=`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`}
async function openRv(){rv.classList.add("o");rm.textContent="";rl.textContent="جاري التحميل...";
const{data,error}=await sb.from("reviews").select("name,comment,created_at").eq("approved",true).order("created_at",{ascending:false}).limit(50);
if(error){rl.textContent="تعذر تحميل الآراء";return}
rl.innerHTML=data.length?data.map(r=>`<div class="rv"><b>${E(r.name)}</b><br>${E(r.comment)}<br><small>${new Date(r.created_at).toLocaleDateString("ar-EG")}</small></div>`).join(""):"<p>كن أول من يكتب رأيه</p>"}
function closeRv(){rv.classList.remove("o")}
async function sendRv(){const a=rn.value.trim(),c=rc.value.trim();if(!a||!c)return alert("اكتب الاسم والتعليق");
rs.disabled=true;const{error}=await sb.from("reviews").insert({name:a,comment:c});rs.disabled=false;
if(error){rm.textContent="تعذر الإرسال، حاول مرة أخرى";return}
rn.value="";rc.value="";rm.textContent="شكراً لك! سيظهر تعليقك بعد المراجعة."}
load();
</script></body></html>
